# ========================================================
# Database Configuration for Travel App
# ========================================================
# You can override any of these properties at runtime using
# Environment Variables: DB_TYPE, DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
# ========================================================

# Database type: mysql (default for AWS EC2) or sqlite (for local zero-setup testing)
db.type=mysql

# MySQL Settings (Point to your 2nd AWS EC2 instance IP or RDS endpoint)
db.host=localhost
db.port=3306
db.name=travel_db
db.user=root
db.password=root

# Additional JDBC parameters
db.useSSL=false
db.allowPublicKeyRetrieval=true
db.serverTimezone=UTC

# SQLite Settings (Used if db.type=sqlite or when MySQL is unreachable in dev)
sqlite.filepath=travel_app.db
